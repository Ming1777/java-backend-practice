spring.application.name=springboot-user-center

spring.datasource.url=jdbc:mysql://localhost:3306/java_backend_practice?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
spring.datasource.username=java_app
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
# 【手敲】Redis连接配置
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.database=0
logging.level.com.ming.usercenter.mapper=INFO
logging.level.com.ming.usercenter.mapper.UserMapper.findAll=DEBUG
